[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-text-compressor"
version = "0.2.0"
description = "Ordered learned text memories and parallel paragraph reconstruction"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2,<3",
  "tokenizers>=0.21,<1",
  "datasets>=3.6,<5",
  "gradio>=6.29,<7",
  "rapidfuzz>=3,<4",
  "ipykernel>=7.4.0",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5", "ipykernel>=6,<8", "nbclient>=0.10,<1"]
cpu = ["torch==2.14.0"]
cuda = ["torch==2.14.0; sys_platform != 'darwin'"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
latent-text = "latent_text.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
conflicts = [[{extra = "cpu"}, {extra = "cuda"}]]

[tool.uv.sources]
torch = [
  {index = "pytorch-cpu", extra = "cpu"},
  {index = "pytorch-cuda", extra = "cuda"}
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
